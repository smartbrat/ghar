<section class="dp-partner-wrap" aria-label="Brand Connect for Pillar name">
  <a href="/brand-connect?vertical=pillar" class="dp-partner">
    <div class="dp-partner__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/>
        <path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/>
      </svg>
    </div>
    <div class="dp-partner__content">
      <p class="dp-partner__eyebrow">Brand Connect &middot; Pillar name</p>
      <h2 class="dp-partner__name">Place your brand inside the conversation on this pillar.</h2>
      <p class="dp-partner__lead">One or two lines on the formats on offer and who reads this vertical.</p>
    </div>
    <span class="dp-partner__cta">
      Explore Brand Connect
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
    </span>
  </a>
</section>
