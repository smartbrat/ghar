<!-- @snippet -->
<!-- Chips. checkbox = many can be on, radio = exactly one -->
<div class="jm-chip-row">
  <label class="jm-chip">
    <input type="checkbox" name="amenities" value="pool">
    <svg class="jm-chip__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 17c1.5 0 1.5 1.5 3 1.5s1.5-1.5 3-1.5 1.5 1.5 3 1.5 1.5-1.5 3-1.5 1.5 1.5 3 1.5 1.5-1.5 3-1.5M2 12c1.5 0 1.5 1.5 3 1.5S6.5 12 8 12s1.5 1.5 3 1.5S12.5 12 14 12s1.5 1.5 3 1.5S18.5 12 20 12M8 8V4a2 2 0 0 1 4 0"/></svg>
    Pool
  </label>
  <label class="jm-chip">
    <input type="checkbox" name="amenities" value="power-backup">
    <svg class="jm-chip__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
    Power backup
  </label>
</div>

<!-- Tiles. Same states, room to explain the option -->
<div class="jm-tile-grid">
  <label class="jm-tile">
    <input type="checkbox" name="stage" value="ready">
    <svg class="jm-tile__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21.4 8 14 2 9.4h7.6z"/></svg>
    <span class="jm-tile__body">
      <span class="jm-tile__title">Ready to move</span>
      <span class="jm-tile__desc">Possession now, with the completion certificate already issued.</span>
    </span>
  </label>
  <label class="jm-tile">
    <input type="checkbox" name="stage" value="under-construction">
    <svg class="jm-tile__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M4 21V10l8-6 8 6v11M10 21v-6h4v6"/><path d="M9 10h.01M15 10h.01"/></svg>
    <span class="jm-tile__body">
      <span class="jm-tile__title">Under construction</span>
      <span class="jm-tile__desc">Payment staged against progress.</span>
    </span>
  </label>
</div>

<div class="jm-chip-row">
  <label class="jm-chip jm-chip--sm"><input type="radio" name="pvBhk">Any</label>
  <label class="jm-chip jm-chip--sm"><input type="radio" name="pvBhk">1 BHK</label>
  <label class="jm-chip jm-chip--sm"><input type="radio" name="pvBhk" checked>2 BHK</label>
  <label class="jm-chip jm-chip--sm"><input type="radio" name="pvBhk">3 BHK</label>

<div class="jm-tile-grid">
  <label class="jm-tile">
    <input type="checkbox" checked>
    <svg class="jm-tile__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21.4 8 14 2 9.4h7.6z"/></svg>

  </label>
  <label class="jm-tile">

    <svg class="jm-tile__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span class="jm-tile__body"><span class="jm-tile__title">Auction</span><span class="jm-tile__desc">Not yet available in this city. Disabled, not hidden.</span></span>

    <svg class="jm-tile__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6M4 18h16M6 10V7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v3M6 21v-3M18 21v-3"/></svg>
    <span class="jm-tile__body"><span class="jm-tile__title">Fully furnished</span><span class="jm-tile__desc">Move in with a suitcase.</span></span>
  </label>
  <label class="jm-tile jm-tile--stack">
    <input type="radio" name="pvFurnish">

    <svg class="jm-tile__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M10 21v-5h4v5"/></svg>
