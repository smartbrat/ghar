<!-- @snippet -->
<div class="seg seg--choice" role="radiogroup" aria-label="Buy or rent">
  <button type="button" class="seg__btn" role="radio" aria-checked="true">Buy</button>
  <button type="button" class="seg__btn" role="radio" aria-checked="false" tabindex="-1">Rent</button>
</div>

<div class="seg seg--choice" role="radiogroup" aria-label="Property type">
  <button type="button" class="seg__btn" role="radio" aria-checked="true"><svg class="seg__ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.2 12 3.2l9 7"/><path d="M5.2 9v11.8h13.6V9"/><path d="M9.8 20.8V15h4.4v5.8"/></svg><span>Residential</span></button>
  <button type="button" class="seg__btn" role="radio" aria-checked="false" tabindex="-1"><svg class="seg__ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.8h18"/><path d="M6 20.8V4.5h8.5v16.3"/><path d="M14.5 20.8V10.5H19v10.3"/></svg><span>Commercial</span></button>
  <button type="button" class="seg__btn" role="radio" aria-checked="false" tabindex="-1"><svg class="seg__ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.6 9.2 4l5.6 2.6L21 4v13.4l-6.2 2.6-5.6-2.6L3 20z"/><path d="M9.2 4v13.4M14.8 6.6V20"/></svg><span>Land</span></button>
</div>
