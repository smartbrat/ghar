<!-- @snippet -->
<input type="text" name="name" class="jm-field" placeholder="Your name" required autocomplete="name">

<div class="jm-phone">
  <div class="jm-phone-prefix">
    <img src="https://flagcdn.com/w40/in.png" alt="IN" width="40" height="30" loading="lazy" decoding="async">
    <span>+91</span>
  </div>
  <input type="tel" name="phone" placeholder="Mobile number" maxlength="10" inputmode="numeric" autocomplete="tel" required>
</div>

<input type="email" name="email" class="jm-field" placeholder="Email (optional)" autocomplete="email">

<div class="brf-row">
  <select name="projectType" class="jm-field" required aria-label="What are you building?">
    <option value="" selected disabled>What are you building?</option>
    <option value="home-interiors">Home interiors</option>
    <option value="renovation">Renovation or restoration</option>
  </select>
  <select name="city" class="jm-field" required aria-label="Which city is the project in?">
    <option value="" selected disabled>Which city?</option>
    <option>Mumbai</option>
    <option>Bengaluru</option>
  </select>
</div>

<textarea name="message" class="jm-field" placeholder="Anything else worth knowing? Site, style, constraints." rows="3"></textarea>

<!-- @preview-style -->
body > *{max-width:440px}
