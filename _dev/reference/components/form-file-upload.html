<!-- @snippet -->
<label class="jm-file">
  <input type="file" name="photos" multiple accept="image/*" data-file-list="photoList">
  <svg class="jm-file__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
  <span class="jm-file__label">Add photos</span>
  <span class="jm-file__hint">Drag them here, or click to browse. JPG or PNG, up to 5 MB each.</span>
</label>
<ul class="jm-file-list" id="photoList"></ul>
