<!-- @snippet -->
<fieldset class="jm-fieldset">
  <legend class="jm-legend">The property</legend>
  <p>Where it is and what it is. This is what buyers search on.</p>
  <input type="text" class="jm-field" name="building" placeholder="Project or building name">
  <div class="brf-row">
    <select class="jm-field" name="type" aria-label="Property type">
      <option value="" selected disabled>Type</option>
      <option>Apartment</option>
      <option>Villa</option>
      <option>Plot</option>
    </select>
    <select class="jm-field" name="configuration" aria-label="Configuration">
      <option value="" selected disabled>Configuration</option>
      <option>1 BHK</option>
      <option>2 BHK</option>
      <option>3 BHK</option>
    </select>
  </div>
</fieldset>

<fieldset class="jm-fieldset">
  <legend class="jm-legend">Your description</legend>
  <p>What a photograph cannot show. Light, neighbours, the walk to the station.</p>
  <textarea class="jm-field" name="description" rows="4" maxlength="300" data-counter="descCount" placeholder="Mornings get full sun on the east side."></textarea>
  <span class="jm-counter" id="descCount"></span>
</fieldset>

<div class="jm-actions">
  <button type="button" class="jm-btn jm-btn--secondary">Save draft</button>
  <button type="submit" class="jm-btn jm-btn--primary">Continue</button>
</div>

<!-- @preview-style -->
body{max-width:440px}
