<!-- @snippet -->
<section class="gtk-format-wrap" aria-labelledby="gtkFormatTitle">
  <div class="gtk-format">
    <a class="gtk-format__media" href="/ghartalks/episode-slug" aria-label="Episode title">
      <span class="gtk-facade">
        <img class="gtk-facade__img" src="https://placehold.co/1280x720/3a2f27/e5dcc8?text=16:9" alt="" width="1280" height="720" loading="lazy" decoding="async">
        <span class="gtk-facade__play" aria-hidden="true">
          <svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg>
        </span>
        <span class="gtk-facade__dur">00:00</span>
      </span>
    </a>
    <div class="gtk-format__body">
      <span class="gtk-format__eyebrow">Every episode, written up</span>
      <h2 id="gtkFormatTitle" class="gtk-format__title">A short line on watching and reading.</h2>
      <p class="gtk-format__excerpt">&ldquo;The opening lines of the published write-up for this episode, quoted exactly&hellip;&rdquo;</p>
      <p class="gtk-format__excerpt" style="margin-top:16px"><a href="/ghartalks/episode-slug" class="btn-link">Read the write-up <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg></a></p>
    </div>
  </div>
</section>
