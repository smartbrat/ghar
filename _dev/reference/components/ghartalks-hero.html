<!-- @snippet -->
<section class="gtk-hero" aria-labelledby="gtkHeroTitle">
  <div class="gtk-hero__inner">
    <header class="gtk-hero__intro">
      <h1 id="gtkHeroTitle" class="gtk-hero__title">GharTalks</h1>
      <p class="gtk-hero__desc">One line on what this vertical records, for the reader.</p>
    </header>
    <a href="/ghartalks/episode-slug" class="gtk-hero__ep">
      <div class="gtk-hero__media">
        <span class="gtk-facade">
          <img class="gtk-facade__img" src="https://placehold.co/1280x720/3a2f27/e5dcc8?text=16:9" alt="" width="1280" height="720" fetchpriority="high" decoding="async">
          <span class="gtk-facade__ep">Featured</span>
          <span class="gtk-facade__play" aria-hidden="true">
            <svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg>
          </span>
        </span>
      </div>
      <div class="gtk-hero__panel">
        <span class="gtk-hero__kicker">
          <span>Beat</span>
          <span aria-hidden="true">&middot;</span>
          <span>Full conversation</span>
        </span>
        <h2 class="gtk-hero__eptitle">The featured episode title in one or two lines</h2>
        <p class="gtk-hero__dek">One or two sentences on what the conversation covers.</p>
        <span class="vx-speaker">
          <span class="vx-speaker__id">
            <span class="vx-speaker__name">Guest name</span>
            <span class="vx-speaker__role">Organisation &middot; City</span>
          </span>
        </span>
      </div>
    </a>
  </div>
</section>
