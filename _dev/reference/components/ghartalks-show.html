<!-- @snippet -->
<main class="gtk-page">
  <section class="gtk-show" aria-labelledby="gtkHeroTitle">
    <div class="gtk-show__media" aria-hidden="true">
      <picture><source type="image/avif" srcset="/brand_assets/ghartalks/frames/abhikrama-640.avif 640w, /brand_assets/ghartalks/frames/abhikrama-1280.avif 1280w" sizes="100vw"><source type="image/webp" srcset="/brand_assets/ghartalks/frames/abhikrama-640.webp 640w, /brand_assets/ghartalks/frames/abhikrama-1280.webp 1280w" sizes="100vw"><img class="gtk-show__img" src="/brand_assets/ghartalks/frames/abhikrama.jpg" alt="" loading="eager" fetchpriority="high" decoding="async" width="1280" height="720"></picture>
    </div>
    <div class="gtk-show__inner">
      <h1 id="gtkHeroTitle" class="gtk-show__mark">
        <img class="gtk-show__logo" src="/brand_assets/ghartalks/ghartalks-logo-white.svg" alt="GharTalks" width="383" height="141">
      </h1>
      <a href="/ghartalks/episode-slug" class="gtk-show__ep">
        <span class="gtk-show__eyebrow">Featured conversation &middot; Beat</span>
        <h2 class="gtk-show__name">Guest Name</h2>
        <span class="gtk-show__role">Company &middot; City</span>
        <span class="gtk-show__title">The episode title, one or two lines</span>
        <span class="gtk-show__play" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg></span>
      </a>
      <p class="gtk-show__about">One line about the show.</p>
    </div>
  </section>
</main>
