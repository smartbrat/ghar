<!-- @snippet -->
<section class="gtk-library" aria-labelledby="gtkEpisodesTitle">
  <div class="gtk-library__head">
    <h2 id="gtkEpisodesTitle" class="gtk-library__title">Conversations</h2>
    <div class="gtk-library__chips" role="group" aria-label="Filter conversations by beat">
      <button type="button" class="dp-chip is-active" data-gtk-filter="all" aria-pressed="true">All</button>
      <button type="button" class="dp-chip" data-gtk-filter="market" aria-pressed="false">Market</button>
    </div>
  </div>
  <div class="gtk-tiles">
    <a href="/ghartalks/episode-slug" class="gtk-tile" data-beat="market">
      <span class="gtk-tile__media"><picture><source type="image/avif" srcset="/brand_assets/ghartalks/frames/mumbai-rise-or-fall-2026-640.avif 640w, /brand_assets/ghartalks/frames/mumbai-rise-or-fall-2026-1280.avif 1280w" sizes="(min-width: 1080px) 33vw, (min-width: 640px) 50vw, 100vw"><source type="image/webp" srcset="/brand_assets/ghartalks/frames/mumbai-rise-or-fall-2026-640.webp 640w, /brand_assets/ghartalks/frames/mumbai-rise-or-fall-2026-1280.webp 1280w" sizes="(min-width: 1080px) 33vw, (min-width: 640px) 50vw, 100vw"><img class="gtk-tile__img" src="/brand_assets/ghartalks/frames/mumbai-rise-or-fall-2026.jpg" alt="" loading="lazy" decoding="async" width="1280" height="720"></picture></span>
      <span class="gtk-tile__top">
        <span class="gtk-tile__beat">Market</span>
        <span class="gtk-tile__dur">12:52</span>
      </span>
      <span class="gtk-tile__play" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg></span>
      <span class="gtk-tile__body">
        <h3 class="gtk-tile__title">The episode title, clamped to two lines</h3>
        <span class="gtk-tile__meta"><span class="gtk-tile__name">Guest Name</span><span class="gtk-tile__role">Company, City</span></span>
      </span>
    </a>
    <div class="gtk-tile gtk-tile--invite">
      <h3 class="gtk-tile__invite-title">Be on GharTalks</h3>
      <p class="gtk-tile__invite-dek">One line inviting a pitch or a nomination.</p>
      <div class="jm-actions gtk-tile__actions">
        <a href="/ghartalks/nominate" class="jm-btn jm-btn--secondary">Nominate a guest</a>
        <a href="/ghartalks/pitch" class="jm-btn jm-btn--primary">Pitch a conversation</a>
      </div>
    </div>
  </div>
</section>
