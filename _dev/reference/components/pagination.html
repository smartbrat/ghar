<!-- @snippet -->
<nav class="pager" aria-label="Directory pages">
  <a class="pager__btn" aria-label="Previous page" aria-disabled="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <a class="pager__btn pager__btn--num" href="?page=1" aria-current="page">1</a>
  <a class="pager__btn pager__btn--num" href="?page=2">2</a>
  <a class="pager__btn pager__btn--num" href="?page=3">3</a>
  <span class="pager__gap" aria-hidden="true">&hellip;</span>
  <a class="pager__btn pager__btn--num" href="?page=12">12</a>
  <a class="pager__btn" href="?page=2" aria-label="Next page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
  </a>
  <p class="pager__count">Page 1 of 12</p>
</nav>
