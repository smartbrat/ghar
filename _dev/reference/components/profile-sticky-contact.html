<div class="bpr-sticky-contact" aria-label="Actions">
  <a href="/brands" class="bpr-sticky-contact__back" aria-label="Back to Brands">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <button type="button" class="bpr-btn bpr-btn--light bpr-sticky-contact__primary" data-brand-contact data-brand="Brand Name">
    Contact
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
  </button>
  <button type="button" class="bpr-sticky-contact__util" data-brand-share data-brand="Brand Name" aria-label="Share this brand" title="Share">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
    </svg>
  </button>
  <button type="button" class="bpr-sticky-contact__menu" onclick="openOC&&openOC()" aria-label="Open menu" aria-expanded="false" aria-controls="ocMenu">
    <svg viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M2 3h20"/>
      <path d="M2 8h20"/>
      <path d="M2 13h14"/>
    </svg>
  </button>
</div>
