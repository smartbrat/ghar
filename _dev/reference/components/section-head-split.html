<div class="sec-head">
  <span class="sec-eyebrow">Eyebrow</span>
  <div class="sec-head-row">
    <div class="sec-head-l">
      <h2 id="my-section-h" class="sec-title sec-title--narrow">A short title that owns its line.</h2>
    </div>
