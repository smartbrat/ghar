<!-- @snippet -->
<!-- Plain section -->
<section id="my-section" aria-labelledby="my-section-h">
  <div class="section-wrap">
    <!-- content -->
  </div>
</section>

<!-- Tinted band -->
<section id="my-band" class="section-block section-block--warm" aria-labelledby="my-band-h">
  <div class="section-wrap">
    <!-- content -->
  </div>
</section>

<!-- @preview -->
<main>
  <section aria-label="Plain section">
    <div class="section-wrap">
      <div style="border:1px dashed #d8d2c8;border-radius:12px;padding:24px;font:600 13px Inter,sans-serif;color:#6a6a6a">.section-wrap: centred at --max-w, --pad-h gutter</div>
    </div>
  </section>
  <section class="section-block section-block--warm" aria-label="Tinted band">
    <div class="section-wrap">
      <div style="border:1px dashed #d8d2c8;border-radius:12px;padding:24px;font:600 13px Inter,sans-serif;color:#6a6a6a">.section-block--warm band, same content width</div>
    </div>
  </section>
</main>
