<!-- @snippet -->
<div class="tabs" role="tablist" aria-label="Project detail">
  <button type="button" class="tabs__btn" role="tab" aria-selected="true" aria-controls="tpOverview" id="tabOverview">Overview</button>
  <button type="button" class="tabs__btn" role="tab" aria-selected="false" tabindex="-1" aria-controls="tpPlans" id="tabPlans">Floor plans</button>
</div>
<div id="tpOverview" class="tabs__panel" role="tabpanel" aria-labelledby="tabOverview">...</div>
<div id="tpPlans" class="tabs__panel" role="tabpanel" aria-labelledby="tabPlans" hidden>...</div>
