<!-- @snippet -->
<!-- Name an icon control: the share button in the profile top bar -->
<div class="bpr-topbar__share-wrap tip tip--below tip--end">
  <button type="button" class="bpr-topbar__share tip__anchor" data-brand-share data-brand="Person Name" aria-label="Share this profile" aria-describedby="tip-share">
    <span class="bpr-topbar__share-label">Share</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
  </button>
  <span class="tip__bubble" role="tooltip" id="tip-share">Share this profile</span>
</div>

<!-- Name a link: a reach icon in the person hero (first in its row gets tip--start) -->
<div class="pp-reach__wrap tip tip--start">
  <a class="pp-reach__link pp-reach__link--web tip__anchor" href="https://example.com/" target="_blank" rel="noopener noreferrer" aria-label="example.com" aria-describedby="tip-person-web">
    <span class="pp-reach__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
  </a>
  <span class="tip__bubble" role="tooltip" id="tip-person-web">example.com</span>
</div>
