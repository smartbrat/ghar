<!-- @snippet -->
<!-- Dynamic image: the box holds layout, the image crops -->
<div class="aspect-4-3">
  <img class="img-cover" src="/path/to/image.jpg" alt="" loading="lazy">
</div>

<h3 class="line-clamp-2">Backend title that may run long</h3>
<span class="truncate">Single-line label</span>
<span class="tabular-nums">1,240</span>
<p class="collapse-when-empty"></p>

<!-- Decorative shape behind an icon, coloured on the element -->
<span style="position:relative">
  <svg class="absolute-fill text-sage" viewBox="0 0 200 200" aria-hidden="true">...</svg>
</span>

<!-- @preview -->
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;max-width:800px;font:14px/1.6 Inter,sans-serif;color:#111">
  <div>
    <div class="aspect-4-3" style="border-radius:12px">
      <img class="img-cover" src="https://placehold.co/800x400" alt="">
    </div>
    <p style="margin:8px 0 0;font-size:12px;color:#6a6a6a">.aspect-4-3 + .img-cover on a 2:1 image</p>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px">
    <p class="line-clamp-2" style="margin:0;font-weight:600">A backend title long enough to need clamping at two lines, so the card height does not change with its copy length.</p>
    <span class="truncate" style="display:block;max-width:180px">A single-line label that is far too long for its box</span>
    <span class="tabular-nums" style="font-size:20px">1,111<br>9,999</span>
  </div>
  <div style="display:flex;gap:16px;align-items:center">
    <span style="position:relative;width:64px;height:64px;display:block"><svg class="absolute-fill text-sage" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96" fill="currentColor"/></svg></span>

    <span class="bg-indigo" style="width:64px;height:64px;border-radius:12px;display:block"></span>
