<!-- @snippet -->
<figure class="art-video-hero">
  <span class="gtk-facade" data-gtk-play="VIDEO_ID"
        data-gtk-title="Episode title"
        role="button" tabindex="0"
        aria-label="Play the episode: Episode title">
    <img class="gtk-facade__img" src="https://i.ytimg.com/vi/VIDEO_ID/maxresdefault.jpg" data-yt-fallback="VIDEO_ID" alt="" width="1280" height="720" fetchpriority="high" decoding="async">
    <span class="gtk-facade__play" aria-hidden="true">
      <svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg>
    </span>
    <span class="gtk-facade__dur">12:52</span>
  </span>
</figure>

<div class="gtk-chapters">
  <p class="gtk-chapters__label">In this episode</p>
  <ul class="gtk-chapters__list">
    <li><button type="button" class="gtk-chapter" data-t="0"><span class="gtk-chapter__t">0:00</span><span class="gtk-chapter__c">Chapter title</span></button></li>
    <li><button type="button" class="gtk-chapter" data-t="95"><span class="gtk-chapter__t">1:35</span><span class="gtk-chapter__c">Chapter title</span></button></li>
  </ul>
</div>
