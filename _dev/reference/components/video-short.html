<!-- @snippet -->
<div class="vid-shorts-grid">
  <a href="/videos/video-slug" class="gtk-card vid-card--short" data-topic="topic-slug">
    <div class="gtk-card__media">
      <span class="gtk-facade vid-facade--short">
        <img class="gtk-facade__img" src="https://i.ytimg.com/vi/VIDEO_ID/oar2.jpg" alt="" width="1080" height="1920" loading="lazy" decoding="async">
        <span class="gtk-facade__play" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg></span>
        <span class="gtk-facade__dur">0:58</span>
      </span>
    </div>
    <div class="gtk-card__body">
      <span class="gtk-card__eyebrow">Topic</span>
      <h3 class="gtk-card__title">Short title in one or two lines</h3>
    </div>
  </a>
</div>

<!-- Player (watch page). Not inside an anchor, so the click plays. -->
<figure class="art-video-hero vid-player--short">
  <span class="gtk-facade vid-facade--short" data-gtk-play="VIDEO_ID" data-gtk-title="Short title" role="button" tabindex="0" aria-label="Play the video: Short title">
    <img class="gtk-facade__img" src="https://i.ytimg.com/vi/VIDEO_ID/oar2.jpg" alt="" width="1080" height="1920" fetchpriority="high" decoding="async">
    <span class="gtk-facade__play" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg></span>
    <span class="gtk-facade__dur">0:58</span>
  </span>
</figure>
