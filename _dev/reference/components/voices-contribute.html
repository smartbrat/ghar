<!-- @snippet -->
<section class="vx-contribute-wrap" aria-labelledby="vxContributeTitle">
  <div class="vx-contribute">
    <div>
      <h2 id="vxContributeTitle" class="vx-contribute__title">A question that invites contributors.</h2>
      <p class="vx-contribute__dek">Two sentences on who this vertical publishes and what backs a point of view here.</p>
    </div>
    <div class="vx-contribute__doors">
      <a href="/voices/contribute" class="vx-door">
        <span class="vx-door__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </span>
        <span class="vx-door__text">
          <span class="vx-door__label">Write a perspective</span>
          <span class="vx-door__sub">One line on length and editing terms.</span>
        </span>
        <span class="vx-door__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </span>
      </a>
      <a href="/voices/nominate" class="vx-door">
        <span class="vx-door__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
        </span>
        <span class="vx-door__text">
          <span class="vx-door__label">Nominate a voice</span>
          <span class="vx-door__sub">Someone in the sector we should be reading.</span>
        </span>
        <span class="vx-door__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </span>
      </a>
    </div>
  </div>
</section>
