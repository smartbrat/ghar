<div class="watch-actions">
  <div class="watch-actions__share">
    <button type="button" class="btn btn-accent" data-share data-share-variant="story" data-share-label="Share this episode" data-share-title-from=".art-title" data-share-eyebrow-from=".art-eyebrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg> Share</button>
    <button type="button" class="btn btn-quiet" data-share-copy><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> <span data-share-copy-label>Copy link</span></button>
  </div>
  <a class="watch-actions__yt" href="https://www.youtube.com/watch?v=VIDEO_ID" rel="noopener" target="_blank">Watch on YouTube <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg></a>
</div>

<aside class="watch-share" aria-label="Share">
  <div>
    <p class="watch-share__title">Know someone who should hear this?</p>
    <p class="watch-share__dek">Send the episode on WhatsApp, or copy the link.</p>
  </div>
  <div class="watch-actions__share">
    <button type="button" class="btn btn-accent" data-share data-share-variant="story" data-share-label="Share this episode" data-share-title-from=".art-title" data-share-eyebrow-from=".art-eyebrow">Share</button>
    <button type="button" class="btn btn-quiet" data-share-copy><span data-share-copy-label>Copy link</span></button>
  </div>
</aside>
