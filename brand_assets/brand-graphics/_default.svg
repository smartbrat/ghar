<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet" fill="none" role="img" aria-label="">
  <!-- Self-tinting: sets its own color so `currentColor` resolves to a
       neutral tone the graphic can render in on both light and dark
       grounds. External `<img>` loads block host CSS from crossing the
       shadow boundary, so we cannot inherit the brand token here. Per-tenant
       branded graphics live in their OWN files with their own colors
       hardcoded — /_default.svg is the neutral fallback for everyone. -->
  <style>
    :root { color: #8a8a8a; }
    @media (prefers-color-scheme: dark) { :root { color: #b5b5b5; } }
  </style>
  <!--
    Default ambient graphic for the graphic-hero brand template.
    Blueprint-language, discipline-agnostic: reads as architectural /
    spatial / design-adjacent without depicting any specific tool.

    Colour: uses `currentColor` throughout, so the container's `color`
    tints it. Container sets `color: var(brand, currentColor)` — the
    graphic then inherits the tenant's brand hex automatically.

    Composition:
      · Dot field, radial-faded so the graphic breathes into the page.
      · One clean rectangle in perspective — the "volume".
      · Corner ticks + a diagonal, drawing the eye through the frame.
      · A single small square inset — the "detail".

    Kept low-opacity so hero copy always wins the reading order.
  -->
  <defs>
    <pattern id="ghDots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".9" fill="currentColor" opacity=".28"/>
    </pattern>
    <radialGradient id="ghFade" cx="52%" cy="50%" r="62%">
      <stop offset="0"   stop-color="#fff" stop-opacity="1"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="ghFadeMask" maskUnits="userSpaceOnUse">
      <rect width="800" height="800" fill="url(#ghFade)"/>
    </mask>
  </defs>

  <!-- Dot field, radially masked so the edges breathe into the ground -->
  <rect x="0" y="0" width="800" height="800" fill="url(#ghDots)" mask="url(#ghFadeMask)"/>

  <!-- The volume — a perspectivized rectangle, hairline stroke.
       Slight top-right lift gives it a hint of isometric depth without
       drawing an actual isometric cube (which would look decorative). -->
  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Primary frame -->
    <path d="M 210 260 L 610 250 L 620 550 L 200 560 Z"
          stroke-width="1.2" opacity=".62"/>
    <!-- Diagonal through the frame -->
    <line x1="210" y1="260" x2="620" y2="550"
          stroke-width=".6" stroke-dasharray="4 6" opacity=".38"/>
    <!-- Detail inset — the "zoom" moment -->
    <rect x="470" y="380" width="110" height="82" fill="none"
          stroke-width=".8" opacity=".55"/>
    <!-- Detail crosshair -->
    <line x1="525" y1="380" x2="525" y2="462" stroke-width=".4" opacity=".38"/>
    <line x1="470" y1="421" x2="580" y2="421" stroke-width=".4" opacity=".38"/>
  </g>

  <!-- Corner ticks — surveyor marks anchoring the frame -->
  <g stroke="currentColor" stroke-width=".8" opacity=".7" stroke-linecap="round">
    <!-- top-left -->
    <line x1="200" y1="248" x2="220" y2="248"/>
    <line x1="210" y1="238" x2="210" y2="258"/>
    <!-- top-right -->
    <line x1="600" y1="238" x2="620" y2="238"/>
    <line x1="610" y1="228" x2="610" y2="248"/>
    <!-- bottom-right -->
    <line x1="610" y1="548" x2="630" y2="548"/>
    <line x1="620" y1="538" x2="620" y2="558"/>
    <!-- bottom-left -->
    <line x1="190" y1="558" x2="210" y2="558"/>
    <line x1="200" y1="548" x2="200" y2="568"/>
  </g>

  <!-- Horizon rule + small label anchor at top — quiet type slot,
       kept empty on the default so brands can't accidentally inherit
       another tenant's text. Just a line + endcaps. -->
  <g stroke="currentColor" opacity=".42" stroke-linecap="round">
    <line x1="150" y1="130" x2="650" y2="130" stroke-width=".6"/>
    <path d="M150 130 L158 126 L158 134 Z" fill="currentColor" stroke="none"/>
    <path d="M650 130 L642 126 L642 134 Z" fill="currentColor" stroke="none"/>
  </g>

  <!-- Bottom-right measurement badge — one small circle with a hairline
       cross, reads as "reference mark" without being a specific icon. -->
  <g transform="translate(690 660)" opacity=".55">
    <circle cx="0" cy="0" r="22" fill="none" stroke="currentColor" stroke-width=".7"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="currentColor" stroke-width=".5"/>
    <line x1="0" y1="-14" x2="0" y2="14" stroke="currentColor" stroke-width=".5"/>
    <circle cx="0" cy="0" r="3" fill="currentColor" opacity=".6"/>
  </g>
</svg>
