<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet" fill="none" role="img" aria-label="">
  <!--
    Studio FOV hero graphic — placeholder-quality art, but themed to
    the studio's own disciplines (3D walkthroughs + physical scale
    models + viz). Kept as line-work / blueprint language so it reads
    as "studio scratch" rather than finished promo art.

    Composition:
      · Perspective grid receding to a vanishing point (view frustum)
      · Isometric building volume floating in the frame (scale-model
        silhouette + roof plane + interior lines)
      · Fine dot backdrop with radial fade
      · Camera-frame ticks + a "1 : 200" scale rule at the bottom

    Colour: uses hardcoded brand red at low opacity because CSS
    variables don't cross the `<img>` shadow boundary. Reads correctly
    on Studio FOV's dark ground. Replace this file with signed-off art
    when the studio supplies it — /brand-profile-studifov.html points
    at this path automatically.
  -->
  <style>
    :root { color: #CA3248; }
  </style>
  <defs>
    <pattern id="sfvDots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".9" fill="currentColor" opacity=".26"/>
    </pattern>
    <radialGradient id="sfvFade" cx="50%" cy="50%" r="62%">
      <stop offset="0"   stop-color="#fff" stop-opacity="1"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="sfvFadeMask" maskUnits="userSpaceOnUse">
      <rect width="800" height="800" fill="url(#sfvFade)"/>
    </mask>
    <linearGradient id="sfvVolFill" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity=".12"/>
      <stop offset="1" stop-color="currentColor" stop-opacity=".03"/>
    </linearGradient>
  </defs>

  <!-- Radially-faded dot field -->
  <rect x="0" y="0" width="800" height="800" fill="url(#sfvDots)" mask="url(#sfvFadeMask)"/>

  <!-- Ground plane grid + vanishing lines. Perspective grid running
       to a vanishing point near the horizon; anchors the volume in
       depth without needing photography. -->
  <g stroke="currentColor" opacity=".38" stroke-linecap="round">
    <!-- horizon rule -->
    <line x1="140" y1="290" x2="660" y2="290" stroke-width=".6"/>
    <!-- vanishing lines from the corners -->
    <line x1="120" y1="620" x2="400" y2="290" stroke-width=".5" opacity=".7"/>
    <line x1="680" y1="620" x2="400" y2="290" stroke-width=".5" opacity=".7"/>
    <line x1="220" y1="620" x2="400" y2="290" stroke-width=".35" opacity=".5"/>
    <line x1="580" y1="620" x2="400" y2="290" stroke-width=".35" opacity=".5"/>
    <line x1="320" y1="620" x2="400" y2="290" stroke-width=".28" opacity=".38"/>
    <line x1="480" y1="620" x2="400" y2="290" stroke-width=".28" opacity=".38"/>
    <!-- ground plane depth rules -->
    <line x1="150" y1="540" x2="650" y2="540" stroke-width=".3" opacity=".55"/>
    <line x1="170" y1="480" x2="630" y2="480" stroke-width=".28" opacity=".45"/>
    <line x1="190" y1="430" x2="610" y2="430" stroke-width=".24" opacity=".35"/>
    <line x1="210" y1="390" x2="590" y2="390" stroke-width=".22" opacity=".28"/>
  </g>

  <!-- Isometric building volume — the scale-model silhouette. Two
       cuboids offset (main tower + lower podium) reading as a real
       compact building rather than a generic box. -->
  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <!-- Main tower -->
    <path d="M 300 210 L 380 190 L 500 210 L 420 230 Z" fill="url(#sfvVolFill)" stroke-width="1.15"/>
    <path d="M 300 210 L 300 460 L 420 480 L 420 230" stroke-width="1.15"/>
    <path d="M 420 230 L 500 210 L 500 460 L 420 480" stroke-width="1.15"/>
    <path d="M 420 480 L 420 230" stroke-width="1.15" opacity=".6"/>
    <!-- Interior floor lines (top four, sparser toward bottom) -->
    <line x1="300" y1="278" x2="420" y2="298" stroke-width=".45" opacity=".55"/>
    <line x1="300" y1="330" x2="420" y2="350" stroke-width=".45" opacity=".55"/>
    <line x1="300" y1="382" x2="420" y2="402" stroke-width=".45" opacity=".55"/>
    <line x1="420" y1="298" x2="500" y2="278" stroke-width=".45" opacity=".55"/>
    <line x1="420" y1="350" x2="500" y2="330" stroke-width=".45" opacity=".55"/>
    <line x1="420" y1="402" x2="500" y2="382" stroke-width=".45" opacity=".55"/>
    <!-- Podium (lower block) attached to the right -->
    <path d="M 500 460 L 500 380 L 590 396 L 590 476 Z" fill="url(#sfvVolFill)" stroke-width="1"/>
    <path d="M 500 380 L 542 372 L 632 388 L 590 396" stroke-width="1"/>
    <path d="M 632 388 L 632 468 L 590 476" stroke-width="1"/>
  </g>

  <!-- Base plinth (scale model reads sitting on a plinth, not floating) -->
  <g stroke="currentColor" opacity=".55" stroke-linecap="round">
    <path d="M 240 500 L 680 500 L 680 512 L 240 512 Z" fill="none" stroke-width=".8"/>
    <line x1="240" y1="516" x2="680" y2="516" stroke-width=".4" opacity=".55"/>
  </g>

  <!-- Corner ticks around a "view frame" — the camera looking at the
       scene. Signals a specific viewpoint / rendered still. -->
  <g stroke="currentColor" opacity=".62" stroke-width=".9" stroke-linecap="round">
    <!-- top-left -->
    <line x1="150" y1="150" x2="182" y2="150"/>
    <line x1="150" y1="150" x2="150" y2="182"/>
    <!-- top-right -->
    <line x1="618" y1="150" x2="650" y2="150"/>
    <line x1="650" y1="150" x2="650" y2="182"/>
    <!-- bottom-left -->
    <line x1="150" y1="618" x2="150" y2="650"/>
    <line x1="150" y1="650" x2="182" y2="650"/>
    <!-- bottom-right -->
    <line x1="650" y1="618" x2="650" y2="650"/>
    <line x1="650" y1="650" x2="618" y2="650"/>
  </g>

  <!-- Bottom-right scale rule + label — "1 : 200" reads as a scale-
       model annotation. -->
  <g opacity=".68" stroke-linecap="round">
    <line x1="530" y1="700" x2="650" y2="700" stroke="currentColor" stroke-width=".8"/>
    <line x1="530" y1="695" x2="530" y2="705" stroke="currentColor" stroke-width=".8"/>
    <line x1="590" y1="695" x2="590" y2="705" stroke="currentColor" stroke-width=".5" opacity=".7"/>
    <line x1="650" y1="695" x2="650" y2="705" stroke="currentColor" stroke-width=".8"/>
    <text x="590" y="720" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="currentColor" text-anchor="middle" letter-spacing="1.2" opacity=".85">1 : 200</text>
  </g>

  <!-- Top ruler + section label — hints at "sheet 03" in the studio
       drawing set. Sparse; doesn't fight the hero copy for attention. -->
  <g opacity=".5" stroke-linecap="round">
    <line x1="150" y1="118" x2="650" y2="118" stroke="currentColor" stroke-width=".55"/>
    <text x="160" y="112" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="currentColor" letter-spacing="1.6" opacity=".85">SHEET 03 · SITE + MODEL</text>
    <text x="640" y="112" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="currentColor" letter-spacing="1.4" text-anchor="end" opacity=".85">FOV 82°</text>
  </g>
</svg>
